# 릴리스 — 태그(v*)를 올리면 Windows 에서 빌드·검사하고 GitHub Releases 에 올린다.
#
# 빌드본을 이 공개 로그로 만든다 — 받는 사람이 "누가 어떻게 만들었는지" 볼 수 있게.
#   git tag v0.1.0 && git push origin v0.1.0
#
# 올리는 것: 설치판 · portable 판 · 엔트리 작품(.ent) · SHA256SUMS.txt (scripts/release-files.mjs)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 엔트리 작품 빌드 → 시뮬레이터 검사 → 중계 앱 빌드 → 체크섬
      - run: npm run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 코드 서명 안 함 (README 의 SmartScreen 안내)

      - name: 릴리스 설명 (체크섬 포함)
        shell: pwsh
        run: |
          $sums = Get-Content dist/SHA256SUMS.txt -Raw
          @"
          ⚠️ **실험용입니다.** 화면을 캡처하고 클립보드를 덮어씁니다. 격리된 환경(가상 머신 · Windows Sandbox)에서 쓰기를 권장합니다 — [먼저 읽어 주세요](https://github.com/${{ github.repository }}#️-먼저-읽어-주세요)

          | 파일 | |
          |---|---|
          | ``EntryBrowserRelay-Setup.exe`` | 설치판 |
          | ``EntryBrowserRelay-Portable.exe`` | 설치 없이 실행 |
          | ``entry-browser.ent`` | 엔트리 작품 ([작품 불러오기]) |

          코드 서명을 하지 않아 SmartScreen 경고가 뜹니다. 이 파일들은 이 저장소의 GitHub Actions 가 빌드했습니다 (아래 체크섬과 ``Get-FileHash`` 로 확인).

          ``````
          $sums
          ``````
          "@ | Out-File -Encoding utf8 release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/EntryBrowserRelay-Setup.exe
            dist/EntryBrowserRelay-Portable.exe
            dist/entry-browser.ent
            dist/SHA256SUMS.txt
