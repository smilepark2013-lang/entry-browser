<h1>Entry Browser</h1>
<p>엔트리 블록으로 만든 텍스트 브라우저입니다.
중계 앱을 켜 두면 진짜 웹 페이지를 글과 링크만으로 볼 수 있습니다.</p>

<p><b>실험용입니다.</b> 중계 앱은 화면을 캡처하고 클립보드를 덮어씁니다.
믿을 수 있는 작품과만, 되도록 격리된 환경에서 쓰세요.</p>
